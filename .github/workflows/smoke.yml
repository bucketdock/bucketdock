name: Smoke tests

# Runs on every push and PR. Cheap, fast checks that must pass before any
# build or release workflow is allowed to start.

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend checks (ESLint, Vitest, TypeScript / Next build)
        # Shared with pnpm check so local validation matches CI.
        run: bash scripts/check.sh frontend

  backend:
    name: Rust backend (cargo check + tests)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Backend checks (cargo check + tests)
        # Shared with pnpm check; no Node installation needed for this job.
        run: bash scripts/check.sh backend
